# Focused single-target Crr Measurement-DGPO diagnostic campaign.

logger:
  wandb:
    enabled: true
    project: "DGPO-Measurement"
    run_name: &logger_name "LEP-TauNu-Crr-AdaptiveRefresh-Debug"
    tags:
      - "EveNet"
      - "LEP"
      - "Crr"
      - "adaptive-score-refresh"
      - "single-target-debug"
    entity: ytchou97-university-of-washington
    simplified: false

  local:
    save_dir: /pscratch/sd/t/tihsu/tmp/
    name: *logger_name
    version: v1

platform:
  data_parquet_dir: /pscratch/sd/t/tihsu/database/ZtautauAnalysis/ml_baseline_full_analysis/evenet-input/train-diffusion
  data_parquet_val_dir: /pscratch/sd/t/tihsu/database/ZtautauAnalysis/ml_baseline_full_analysis/evenet-input/val-diffusion

  # Debug with a moderate global batch:
  # 4 workers x 512 events = 2048 generated events per optimizer step.
  number_of_workers: 16
  resources_per_worker:
    CPU: 4
    GPU: 1
  batch_size: 2048
  prefetch_batches: 2
  use_gpu: true

options:
  default: ../EveNet-Align/share/options/options.yaml

  Training:
    apply_event_weight: true

    # 2 logical epochs per trial -> 10 independent validation attempts.
    epochs: 20
    total_epochs: 20

    pretrain_model_load_path: /global/cfs/cdirs/m5019/yiren/Ztautau/shared_checkpoints/diffusion_5pct_seed42_best_val/epoch=224_train=0.1291_val=0.1279.ckpt

    model_checkpoint_save_path: /pscratch/sd/t/tihsu/database/ZtautauAnalysis/ml_baseline_full_analysis/checkpoint-pretrain-DGPO-Crr-adaptive-debug
    model_checkpoint_save_top_k: 1

    strategy:
      default: ../EveNet-Align/share/strategies/measurement_dgpo.yaml
      name: measurement_dgpo

      objective:
        mode: cdiag_conditional

      selection_metric: val/J_cond

      # 8 optimizer steps per logical epoch.
      # One trial therefore contains 16 optimizer steps.
      steps_per_epoch: 8

      plugin:
        class_path: measurement_plugins.evenet_ztautau:ZTauTauSpinMeasurementPlugin
        targets:
          - Crr
        options:
          candidate_feature_names:
            - theta
            - phi
          analyzing_power_source: event_category
          diagnostic_bins: 50

      channels:
        enabled: true
        mixture_source: physical_sample
        weights: {}
        min_score_events: 100

        # For this diagnostic, report poor channel coverage rather than aborting
        # the whole campaign.
        fail_on_insufficient_score_coverage: false

        representative:
          - Ztautau_pipi
          - Ztautau_pirho
          - Ztautau_pie

        major_min_fraction: 0.01
        severe_efficiency_ratio: 0.5

      rollout:
        candidates: 6
        ddim_steps: 10

      score:
        # Use large score statistics because regression stability is the object
        # under test.
        pool_events: "50%"

        hidden_dim: 64
        hidden_layers: 2
        epochs: 50
        batch_size: 1024
        learning_rate: 2.0e-4
        weight_decay: 1.0e-5
        input_mode: target_separated

        adaptive_refresh:
          enabled: true

          # One deterministic midpoint refresh per 16-step trial.
          every_n_policy_steps: 8
          max_refreshes_per_trial: 1

      policy:
        local_epochs: 2
        timesteps: 4
        event_microbatch_size: 128

        reward_scale: 1.0
        scale_reward_by_reference_events: true

        reference_trust: 0.0
        advantage_clip: null
        gradient_clip: 1.0

      # Disable the concurrence/local-velocity controller entirely.
      # This run is meant to isolate score and policy behavior.
      trust_region:
        enabled: false

      validation:
        score_pool_events: "50%"
        candidates: 8
        max_batches: null

        every_n_epochs: 2

        min_relative_improvement: 0.002
        split_noise_multiplier: 2.0

        # For the one-dimensional debug, active/fresh disagreement is diagnosed
        # and visualized, not used as an additional hard veto.
        require_score_parity: false

      diagnostics:
        replacement_check_events: 16
        full_fisher: true

        physics_plots: true
        physics_plot_events: 20000

        response_matrices: true
        response_matrix_events: 20000

        binned_measurement: true
        binned_measurement_events: null
        binned_measurement_accepted_only: false

        log_per_parameter_metrics: true

        score_refit_replicates: 3
        score_plot_events: 20000
        score_curve_bins: 50

  Dataset:
    # Small policy-training campaign.
    dataset_limit: 0.05

    # Do NOT reduce the independent validation set to 5%.
    # Validation statistics are needed to resolve small Crr improvements.
    dataset_limit_apply_to_val_set: false

network:
  default: ../EveNet-Align/share/network/network-20M.yaml
