# Full-state measurement-DGPO overlay. Machine and dataset settings stay in the base YAML.
options:
  Training:
    apply_event_weight: true
    strategy:
      default: ../EveNet-Align/share/strategies/measurement_dgpo_sdm.yaml
      name: measurement_dgpo
      objective:
        mode: sdm_frobenius
      selection_metric: val/J_sdm
      channels:
        min_score_events: 100
        fail_on_insufficient_score_coverage: true
